name: regl_takip
description: "Gelişmiş Regl Takip Uygulaması - Period Tracker"
publish_to: 'none'
version: 1.1.0+7

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  table_calendar: ^3.2.0
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  intl: any
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  csv: ^6.0.0
  pdf: ^3.11.2
  printing: ^5.13.5
  uuid: ^4.5.1
  smooth_page_indicator: ^1.2.0+3

  flutter_animate: ^4.5.2
  timezone: ^0.9.4
  # timezone paketinin tz.local'i varsayılan olarak UTC'dir; cihazın gerçek
  # saat dilimini okuyup setLocalLocation ile bağlamak için gerekli
  flutter_timezone: ^5.1.0
  google_mobile_ads: ^9.0.0
  # Google Mobile Ads WebView entegrasyonu için resmi üst seviye eklenti.
  webview_flutter: ^4.13.0
  shared_preferences: ^2.4.8
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_picker: ^11.0.2
  home_widget: ^0.9.2+1
  quick_actions: ^1.1.0
  in_app_purchase: ^3.2.3
  health: ^13.1.3
  sentry_flutter: ^9.24.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# App icon: dart run flutter_launcher_icons
# ponytail: R1 is 512px; 1024px source would be sharper on iOS.
flutter_launcher_icons:
  image_path: "assets/art/R1-logomark.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FDF2F8"
  adaptive_icon_background: "#FDF2F8"
  adaptive_icon_foreground: "assets/art/R1-logomark.png"

# Splash: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FDF2F8"
  background_image: "assets/art/R2-splash.png"
  image: "assets/art/R1-logomark.png"
  android_12:
    image: "assets/art/R1-logomark.png"
    color: "#FDF2F8"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/legal/privacy_policy_tr.md
    - assets/legal/privacy_policy_en.md

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
