name: Android APK

# Elle tetiklenir: Actions sekmesinden "Run workflow" ile herhangi bir dal
# seçilip test APK'sı alınabilir. Codemagic'teki android-workflow ile aynı
# adımlar, farkı çıktının GitHub release'ine asılması.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Yerel geliştirme beta ile yapılıyor; health/home_widget bağımlılıkları
      # eski stable'da çözülmeyebilir
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      # key.properties CI'da yoksa gradle guard'ı debug anahtarıyla imzalar
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Test APK — ${{ github.ref_name }} (${{ github.run_number }})
          body: |
            `${{ github.ref_name }}` dalının ${{ github.sha }} commit'inden
            otomatik üretilmiş test APK'sı.

            Telefona kurmak için **arm64-v8a** dosyasını indirin (2019 sonrası
            hemen her Android cihaz bu mimaride). Kurulum sırasında
            "bilinmeyen kaynaklardan yüklemeye izin ver" gerekir.

            Debug anahtarıyla imzalıdır — Play Store'a yüklenemez, yalnızca
            elden kurulum içindir.
          prerelease: true
          files: build/app/outputs/flutter-apk/*.apk
