name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n/generated
      - run: flutter analyze
      - run: flutter test
  billing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/billing/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
