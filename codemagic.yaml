workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      # Güncel eklenti zinciri Dart >=3.9 istiyor; hareketli kanal yerine
      # doğrulanan kararlı araç zincirini yeniden üretilebilir biçimde sabitle.
      flutter: 3.44.8
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate localizations
        script: |
          flutter gen-l10n
      - name: Analyze
        script: |
          flutter analyze
      - name: Tests
        script: |
          flutter test
      - name: Build app bundle
        script: |
          # Play Console APK değil AAB bekliyor. key.properties CI'da yoksa
          # bu yalnız derleme doğrulama artefaktıdır; mağaza yüklemesi yerel
          # release anahtarıyla imzalanmış AAB üzerinden yapılır.
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - dehbkoclugu@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.regl.reglTakip
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate localizations
        script: |
          flutter gen-l10n
      - name: Analyze
        script: |
          flutter analyze
      - name: Tests
        script: |
          flutter test
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --no-tree-shake-icons --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - dehbkoclugu@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
