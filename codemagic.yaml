workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    # main dalına her push'ta kendiliğinden derlenir (elle başlatmaya gerek yok)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      android_signing:
        - regl
      # Google Play servis hesabı anahtarı (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS).
      # Codemagic > Environment variables'ta "google_play" grubunda tanımlanır.
      groups:
        - google_play
      flutter: 3.44.8
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate localizations
        script: |
          flutter gen-l10n
      - name: Analyze
        script: |
          flutter analyze
      - name: Tests
        script: |
          flutter test
          TZ=Europe/Berlin flutter test
      - name: Configure Android signing
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build app bundle
        script: |
          flutter build appbundle --release
      - name: Build installable APKs
        script: |
          flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - dehbkoclugu@gmail.com
        notify:
          success: true
          failure: true
      # AAB Play Console'a kendiliğinden yüklenir. Önce "internal" (dahili
      # test) kanalına gider; Play Console'da tek tıkla üretime yükseltilir.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    # main dalına her push'ta kendiliğinden derlenir (elle başlatmaya gerek yok)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.regl.reglTakip
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate localizations
        script: |
          flutter gen-l10n
      - name: Analyze
        script: |
          flutter analyze
      - name: Tests
        script: |
          flutter test
          TZ=Europe/Berlin flutter test
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --no-tree-shake-icons --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - dehbkoclugu@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
