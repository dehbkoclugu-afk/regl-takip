workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.regl.reglTakip
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Generate localizations
        script: |
          flutter gen-l10n
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.regl.reglTakip --type IOS_APP_STORE --create
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect certificates list --type IOS_DISTRIBUTION || app-store-connect certificates create --type IOS_DISTRIBUTION
          app-store-connect fetch-signing-files com.regl.reglTakip --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --no-tree-shake-icons --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - dehbkoclugu@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
